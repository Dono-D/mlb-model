name: Daily MLB Model Refresh

on:
  schedule:
    - cron: '0 14 * * *'  # 9am ET (2pm UTC) every day
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write           # allows the workflow to push data files back to repo

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run MLB model
        run: python run_all.py

      - name: Commit updated data
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/bullpen.json data/expectations.json data/combined.json
          git diff --staged --quiet || git commit -m "Daily refresh $(date +'%Y-%m-%d')"
          git push
