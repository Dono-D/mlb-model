<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Model Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: #0d0d0d;
    color: #e8e8e8;
    min-height: 100vh;
  }

  .top-bar {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
  }

  .logo span { color: #22c55e; }

  .meta {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.5px;
  }

  .refresh-btn {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid #333;
    background: transparent;
    color: #888;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }

  .refresh-btn:hover { border-color: #22c55e; color: #22c55e; }
  .refresh-btn.loading { color: #555; border-color: #222; cursor: wait; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 6px 14px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #555;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: #444; color: #aaa; }

  .filter-btn.active {
    background: #22c55e;
    border-color: #22c55e;
    color: #000;
    font-weight: 600;
  }

  .sort-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sort-label { font-size: 11px; color: #444; letter-spacing: 0.5px; }

  select {
    font-family: inherit;
    font-size: 11px;
    padding: 6px 10px;
    border: 1px solid #2a2a2a;
    background: #111;
    color: #666;
    border-radius: 3px;
    cursor: pointer;
  }

  .table-wrap { width: 100%; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }

  thead th {
    text-align: left;
    font-size: 10px;
    color: #444;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 0 12px 10px;
    border-bottom: 1px solid #1a1a1a;
    white-space: nowrap;
  }

  thead th:first-child { padding-left: 0; }

  tbody tr.team-row {
    border-bottom: 1px solid #161616;
    cursor: pointer;
    transition: background 0.1s;
  }

  tbody tr.team-row:hover { background: #141414; }

  tbody tr.detail-row { display: none; background: #0f0f0f; }
  tbody tr.detail-row.open { display: table-row; }

  td { padding: 12px; vertical-align: middle; }
  td:first-child { padding-left: 0; }

  .team-name { font-size: 13px; font-weight: 600; color: #e8e8e8; white-space: nowrap; }
  .team-full { font-size: 10px; color: #3a3a3a; margin-top: 2px; letter-spacing: 0.3px; }

  .record { font-size: 12px; color: #666; white-space: nowrap; }
  .record strong { color: #aaa; }

  .tank-wrap { display: flex; align-items: center; gap: 10px; }

  .tank-bar {
    width: 70px;
    height: 5px;
    background: #1e1e1e;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .tank-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  .tank-text { font-size: 10px; color: #444; white-space: nowrap; letter-spacing: 0.5px; }

  .delta { font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .delta.pos { color: #22c55e; }
  .delta.neg { color: #ef4444; }
  .delta.neu { color: #555; }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
  }

  .badge.hot    { background: #1a0a0a; color: #ef4444; border: 1px solid #3a1515; }
  .badge.ahead  { background: #0a110a; color: #22c55e; border: 1px solid #153a15; }
  .badge.track  { background: #111; color: #555; border: 1px solid #222; }
  .badge.behind { background: #0f0d07; color: #f59e0b; border: 1px solid #332b0f; }
  .badge.cold   { background: #0a0d1a; color: #6b87ef; border: 1px solid #151f3a; }

  .proj { font-size: 11px; color: #444; white-space: nowrap; }

  .detail-inner {
    padding: 12px 16px 16px;
    border-left: 2px solid #1e1e1e;
    margin: 0 0 0 4px;
  }

  .detail-title { font-size: 10px; color: #333; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }

  .reliever-list { display: flex; flex-wrap: wrap; gap: 6px; }

  .reliever-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 5px 10px;
    border: 1px solid #1e1e1e;
    border-radius: 3px;
    color: #555;
    background: #111;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  .loading-state {
    text-align: center;
    padding: 80px 20px;
    color: #333;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .error-state {
    text-align: center;
    padding: 80px 20px;
    color: #ef4444;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: #111;
    border: 1px solid #1e1e1e;
    border-radius: 6px;
    padding: 14px 16px;
  }

  .stat-label { font-size: 10px; color: #444; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #e8e8e8; }
  .stat-sub { font-size: 11px; color: #333; margin-top: 2px; }

  @media (max-width: 600px) {
    .top-bar { padding: 12px 16px; }
    .logo { font-size: 11px; }
    .meta { display: none; }
    td { padding: 10px 8px; }
    .team-full { display: none; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">MLB <span>Model</span></div>
  <div class="meta" id="meta">Loading...</div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadData()">↻ Refresh</button>
</div>

<div class="container">
  <div id="app">
    <div class="loading-state">Fetching live data...</div>
  </div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/Dono-D/mlb-model/main/data/combined.json';

let allTeams = [];
let currentFilter = 'all';
let currentSort = 'delta';
let openTeam = null;

function tankColor(score) {
  if (score >= 0.75) return '#22c55e';
  if (score >= 0.50) return '#f59e0b';
  if (score >= 0.25) return '#f97316';
  return '#ef4444';
}

function badgeClass(label) {
  if (!label) return 'track';
  const l = label.toLowerCase();
  if (l.includes('hot')) return 'hot';
  if (l.includes('ahead')) return 'ahead';
  if (l.includes('on track')) return 'track';
  if (l.includes('behind')) return 'behind';
  if (l.includes('cold')) return 'cold';
  return 'track';
}

function badgeText(label) {
  if (!label) return 'On Track';
  return label.replace(/[🔥📈➡️📉❄️]/gu, '').trim();
}

function dotColor(avail) {
  if (avail >= 0.75) return '#22c55e';
  if (avail >= 0.50) return '#f59e0b';
  if (avail >= 0.25) return '#f97316';
  return '#ef4444';
}

function render() {
  let teams = [...allTeams];

  if (currentFilter === 'hot')      teams = teams.filter(t => t.expectation.delta >= 5);
  else if (currentFilter === 'ahead')  teams = teams.filter(t => t.expectation.delta >= 2 && t.expectation.delta < 5);
  else if (currentFilter === 'track')  teams = teams.filter(t => t.expectation.delta >= -2 && t.expectation.delta < 2);
  else if (currentFilter === 'behind') teams = teams.filter(t => t.expectation.delta < -2 && t.expectation.delta >= -5);
  else if (currentFilter === 'cold')   teams = teams.filter(t => t.expectation.delta < -5);
  else if (currentFilter === 'depleted') teams = teams.filter(t => t.bullpen.score < 0.55);

  if (currentSort === 'delta')   teams.sort((a,b) => b.expectation.delta - a.expectation.delta);
  else if (currentSort === 'bullpen') teams.sort((a,b) => a.bullpen.score - b.bullpen.score);
  else if (currentSort === 'wins')    teams.sort((a,b) => b.expectation.actual_wins - a.expectation.actual_wins);
  else if (currentSort === 'name')    teams.sort((a,b) => a.name.localeCompare(b.name));

  const hot  = allTeams.filter(t => t.expectation.delta >= 5).length;
  const cold = allTeams.filter(t => t.expectation.delta < -5).length;
  const dep  = allTeams.filter(t => t.bullpen.score < 0.55).length;
  const avg  = allTeams.reduce((s,t) => s + t.bullpen.score, 0) / allTeams.length;

  const html = `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-label">Hot teams</div>
        <div class="stat-value" style="color:#ef4444">${hot}</div>
        <div class="stat-sub">outperforming by 5+ wins</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cold teams</div>
        <div class="stat-value" style="color:#6b87ef">${cold}</div>
        <div class="stat-sub">underperforming by 5+ wins</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Depleted pens</div>
        <div class="stat-value" style="color:#f59e0b">${dep}</div>
        <div class="stat-sub">bullpen score below 55%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg pen health</div>
        <div class="stat-value">${Math.round(avg * 100)}<span style="font-size:14px;color:#444">%</span></div>
        <div class="stat-sub">league average</div>
      </div>
    </div>

    <div class="controls">
      <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">All</button>
      <button class="filter-btn ${currentFilter==='hot'?'active':''}" onclick="setFilter('hot')">Hot</button>
      <button class="filter-btn ${currentFilter==='ahead'?'active':''}" onclick="setFilter('ahead')">Ahead</button>
      <button class="filter-btn ${currentFilter==='track'?'active':''}" onclick="setFilter('track')">On Track</button>
      <button class="filter-btn ${currentFilter==='behind'?'active':''}" onclick="setFilter('behind')">Behind</button>
      <button class="filter-btn ${currentFilter==='cold'?'active':''}" onclick="setFilter('cold')">Cold</button>
      <button class="filter-btn ${currentFilter==='depleted'?'active':''}" onclick="setFilter('depleted')">Depleted pen</button>
      <div class="sort-wrap">
        <span class="sort-label">Sort</span>
        <select onchange="setSort(this.value)">
          <option value="delta" ${currentSort==='delta'?'selected':''}>Expectation delta</option>
          <option value="bullpen" ${currentSort==='bullpen'?'selected':''}>Bullpen (worst first)</option>
          <option value="wins" ${currentSort==='wins'?'selected':''}>Wins</option>
          <option value="name" ${currentSort==='name'?'selected':''}>Team name</option>
        </select>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Team</th>
            <th>Record</th>
            <th>Bullpen</th>
            <th>Delta</th>
            <th>Proj W</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${teams.map(team => {
            const e = team.expectation;
            const b = team.bullpen;
            const pct = Math.round(b.score * 100);
            const color = tankColor(b.score);
            const dSign = e.delta > 0 ? '+' : '';
            const dClass = e.delta >= 2 ? 'pos' : e.delta <= -2 ? 'neg' : 'neu';
            const bc = badgeClass(e.label);
            const bt = badgeText(e.label);
            const isOpen = openTeam === team.name;

            const relievers = b.relievers && b.relievers.length > 0
              ? b.relievers.map(r => {
                  const rest = r.days_rest === 1 ? '1 day rest' : `${r.days_rest} days rest`;
                  return `<div class="reliever-chip"><div class="dot" style="background:${dotColor(r.availability)}"></div>${r.name} · ${rest} · ${Math.round(r.recent_ip * 10)/10} IP</div>`;
                }).join('')
              : '<div style="font-size:11px;color:#333">No recent appearances</div>';

            return `
              <tr class="team-row" onclick="toggleDetail('${team.name}')">
                <td>
                  <div class="team-name">${team.name}</div>
                  <div class="team-full">${team.full_name || ''}</div>
                </td>
                <td><span class="record"><strong>${e.actual_wins}-${e.actual_losses}</strong></span></td>
                <td>
                  <div class="tank-wrap">
                    <div class="tank-bar"><div class="tank-fill" style="width:${pct}%;background:${color}"></div></div>
                    <span class="tank-text">${b.label}</span>
                  </div>
                </td>
                <td><span class="delta ${dClass}">${dSign}${e.delta.toFixed(1)}</span></td>
                <td><span class="proj">${e.projected_wins}W</span></td>
                <td><span class="badge ${bc}">${bt}</span></td>
              </tr>
              <tr class="detail-row ${isOpen ? 'open' : ''}" id="detail-${team.name.replace(/\s/g,'_')}">
                <td colspan="6">
                  <div class="detail-inner">
                    <div class="detail-title">Bullpen arms · last 5 days</div>
                    <div class="reliever-list">${relievers}</div>
                  </div>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('app').innerHTML = html;
}

function toggleDetail(name) {
  const id = `detail-${name.replace(/\s/g,'_')}`;
  const row = document.getElementById(id);
  if (!row) return;
  if (openTeam === name) {
    row.classList.remove('open');
    openTeam = null;
  } else {
    if (openTeam) {
      const prev = document.getElementById(`detail-${openTeam.replace(/\s/g,'_')}`);
      if (prev) prev.classList.remove('open');
    }
    row.classList.add('open');
    openTeam = name;
  }
}

function setFilter(f) {
  currentFilter = f;
  openTeam = null;
  render();
}

function setSort(v) {
  currentSort = v;
  openTeam = null;
  render();
}

async function loadData() {
  const btn = document.getElementById('refresh-btn');
  const meta = document.getElementById('meta');
  btn.classList.add('loading');
  btn.textContent = '↻ Loading...';

  try {
    const url = DATA_URL + '?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed to fetch data');
    const data = await res.json();
    allTeams = data.teams || [];
    meta.textContent = `Last updated: ${data.as_of_date} · ${allTeams.length} teams`;
    render();
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="error-state">Error loading data: ${err.message}</div>`;
    meta.textContent = 'Error loading data';
  } finally {
    btn.classList.remove('loading');
    btn.textContent = '↻ Refresh';
  }
}

loadData();
</script>
</body>
</html>
